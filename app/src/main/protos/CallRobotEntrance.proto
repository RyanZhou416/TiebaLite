syntax = "proto3";

package tieba;

option java_package = "com.huanchengfly.tieba.post.api.models.protos";

import "AbilityConf.proto";
import "StyleConf.proto";

message CallRobotEntrance {
    string ability_type = 1;
    AbilityConf ability_conf = 2;
    StyleConf style_conf = 3;
    int32 skill_id = 4;
}
